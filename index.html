<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Esta línea es la que hace que se vea bien en celular. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzón de sugerencias · Área de Administración</title>
<style>
  :root {
    color-scheme: light dark;
    --fondo: #f4f6f8;
    --texto: #1a2027;
    --tenue: #5b6875;
    --tarjeta: #fff;
    --borde: #dde3ea;
    --acento: #2f6f4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #121820;
      --texto: #e8eef5;
      --tenue: #9aa8b6;
      --tarjeta: #1b232e;
      --borde: #2b3644;
      --acento: #7fc5a0;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.55;
    /* Aire a los lados: en celular pega menos al borde. */
    padding: 32px 20px 56px;
  }

  /* La columna se ensancha sola hasta cierto punto y ahí se queda. */
  .columna {
    width: 100%;
    max-width: 620px;
    margin: 0 auto;
  }

  header { margin-bottom: 28px; }

  /* El nombre del área, arriba del título. Discreto: manda el título. */
  .area {
    margin: 0 0 6px;
    font-size: clamp(14px, 3.6vw, 16px);
    font-weight: 600;
    color: var(--tenue);
  }

  h1 {
    /* El tamaño crece con la pantalla: chico en celular, grande en monitor. */
    font-size: clamp(26px, 6vw, 38px);
    line-height: 1.2;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .para-que {
    margin: 0;
    font-size: clamp(16px, 4vw, 18px);
    color: var(--tenue);
    /* Que no se estire tanto que canse leerla. */
    max-width: 46ch;
  }

  /* El hueco del formulario. Se ve a propósito como algo pendiente. */
  .lugar-del-formulario {
    background: var(--tarjeta);
    border: 2px dashed var(--borde);
    border-radius: 14px;
    padding: clamp(24px, 7vw, 40px) clamp(18px, 5vw, 32px);
    text-align: center;
  }

  .etiqueta {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--acento);
    margin-bottom: 12px;
  }

  .lugar-del-formulario h2 {
    font-size: clamp(18px, 4.5vw, 21px);
    margin: 0 0 8px;
  }

  .lugar-del-formulario p {
    margin: 0;
    color: var(--tenue);
    font-size: 15px;
    max-width: 40ch;
    margin-inline: auto;
  }
</style>
</head>
<body>
  <div class="columna">

    <header>
      <p class="area">Área de Administración</p>
      <h1>Buzón de sugerencias</h1>
      <p class="para-que">Un espacio para dejar una idea o proponer una mejora
        para el área.</p>
    </header>

    <!-- Aquí va el formulario en el siguiente paso. Por ahora solo el hueco. -->
    <section class="lugar-del-formulario" aria-labelledby="titulo-formulario">
      <span class="etiqueta">Próximo paso</span>
      <h2 id="titulo-formulario">Aquí va a ir el formulario</h2>
      <p>Todavía no está listo. Cuando lo esté, en este lugar se va a poder
         escribir y enviar una sugerencia.</p>
    </section>

  </div>
</body>
</html>
